<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Видео — предпросмотр</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0d10; color: #e8e8ec;
    font-family: "Segoe UI", Arial, sans-serif; overflow: hidden;
    user-select: none; -webkit-user-select: none; }
  #page { height: 100%; display: flex; flex-direction: column; }
  header { padding: 14px 22px; border-bottom: 1px solid #22222a; font-size: 13px;
    color: #8b8b99; letter-spacing: .3px; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; }
  .player { width: min(880px, 86vw); aspect-ratio: 16 / 9; background: #000;
    border-radius: 12px; position: relative; cursor: pointer;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .65); }
  .play { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; }
  .play i { display: block; width: 0; height: 0; border-left: 36px solid #fff;
    border-top: 23px solid transparent; border-bottom: 23px solid transparent;
    opacity: .92; margin-left: 8px; }
  .hint { color: #8b8b99; font-size: 13px; }
  .name { color: #cfcfd8; font-size: 15px; }

  #stage { position: fixed; inset: 0; background: #000; display: none; z-index: 9; }
  #v { width: 100%; height: 100%; object-fit: cover; background: #000; }
  body.locked { cursor: none; }

  #fakeX { position: absolute; top: 14px; right: 16px; width: 46px; height: 46px;
    border: 0; border-radius: 10px; background: rgba(255, 255, 255, .08);
    color: #fff; font-size: 22px; line-height: 46px; cursor: pointer;
    opacity: .25; transition: opacity .2s, background .2s; z-index: 12; }
  #fakeX:hover { opacity: 1; background: rgba(255, 80, 80, .55); }

  .escaped { display: none; position: absolute; inset: 0; z-index: 11;
    align-items: center; justify-content: center; flex-direction: column;
    gap: 14px; background: rgba(0, 0, 0, .94); text-align: center; padding: 24px; }
  .escaped b { font-size: 30px; }
  .escaped span { color: #8b8b99; font-size: 15px; max-width: 520px; line-height: 1.5; }
  #stage.escaped .escaped { display: flex; }
  .escaped button { margin-top: 6px; background: #26262d; color: #e8e8ec;
    border: 1px solid #34343d; border-radius: 8px; padding: 10px 22px;
    font-size: 14px; cursor: pointer; }
  .escaped button:hover { background: #32323b; }

  .toast { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%);
    background: rgba(30, 30, 36, .95); border: 1px solid #34343d; color: #fff;
    padding: 12px 22px; border-radius: 10px; font-size: 15px; opacity: 0;
    pointer-events: none; transition: opacity .25s; z-index: 13; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div id="page">
    <header>Медиатека · предпросмотр файла</header>
    <main>
      <div class="name">video_2026.mp4 · 22,6 МБ</div>
      <div class="player" id="player"><div class="play"><i></i></div></div>
      <div class="hint">Нажмите, чтобы воспроизвести</div>
    </main>
  </div>

  <div id="stage">
    <video id="v" src="rick.mp4" preload="auto" playsinline></video>
    <button id="fakeX" data-joke="1" title="Закрыть">✕</button>
    <div class="escaped" id="escaped">
      <b>Ты куда? 😄</b>
      <span>Esc не работает. Нажми в любом месте, чтобы вернуться.</span>
      <button id="fakeExit" data-joke="1">Выйти</button>
    </div>
    <div class="toast" id="toast"></div>
  </div>

<script>
(function () {
  var started = false;
  var ac = null;
  var stage = document.getElementById('stage');
  var v = document.getElementById('v');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  function requestFs() {
    try {
      if (document.fullscreenElement) return;
      if (stage.requestFullscreen) {
        var r = stage.requestFullscreen();
        if (r && r.catch) r.catch(function () {});
      } else if (stage.webkitRequestFullscreen) {
        stage.webkitRequestFullscreen();
      } else if (v.webkitEnterFullscreen) {
        v.webkitEnterFullscreen();
      }
    } catch (e) {}
  }

  function lockPointer() {
    try {
      if (stage.requestPointerLock) {
        var p = stage.requestPointerLock();
        if (p && p.catch) p.catch(function () {});
      }
    } catch (e) {}
  }

  function boost() {
    if (ac) {
      if (ac.state === 'suspended') ac.resume();
      return;
    }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ac = new AC();
      var src = ac.createMediaElementSource(v);
      var gain = ac.createGain();
      gain.gain.value = 1.8;
      var comp = ac.createDynamicsCompressor();
      comp.threshold.value = -8;
      comp.knee.value = 0;
      comp.ratio.value = 20;
      comp.attack.value = 0.002;
      comp.release.value = 0.2;
      src.connect(gain);
      gain.connect(comp);
      comp.connect(ac.destination);
      if (ac.state === 'suspended') ac.resume();
    } catch (e) {
      ac = null;
    }
  }

  function enter() {
    stage.style.display = 'block';
    v.muted = false;
    v.volume = 1;
    v.loop = true;
    document.body.classList.add('locked');
    requestFs();
    lockPointer();
    var p = v.play();
    if (p && p.catch) p.catch(function () {});
  }

  document.addEventListener('click', function (e) {
    var joke = e.target && e.target.closest ? e.target.closest('[data-joke]') : null;
    if (!started) {
      started = true;
      boost();
      enter();
      return;
    }
    if (joke) return;
    if (!document.fullscreenElement) {
      stage.classList.remove('escaped');
      enter();
    } else if (!document.pointerLockElement) {
      lockPointer();
    }
  }, true);

  document.addEventListener('touchstart', function () {
    if (!started) { started = true; boost(); enter(); }
  }, { passive: true });

  document.addEventListener('keydown', function (e) {
    if (!started) return;
    if (e.key === 'F11' || e.key === 'F5') return;
    e.preventDefault();
  }, true);

  document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);

  document.getElementById('fakeX').addEventListener('click', function (e) {
    e.stopPropagation();
    toast('Не так быстро 😄');
  });

  document.getElementById('fakeExit').addEventListener('click', function (e) {
    e.stopPropagation();
    toast('Ага, конечно. Возвращаемся 🙂');
    stage.classList.remove('escaped');
    requestFs();
    lockPointer();
    v.play();
  });

  document.addEventListener('fullscreenchange', function () {
    if (!started) return;
    if (document.fullscreenElement) {
      stage.classList.remove('escaped');
      return;
    }
    // пробуем вернуться сразу, пока браузер ещё считает это действием пользователя
    requestFs();
    setTimeout(function () {
      if (!document.fullscreenElement) stage.classList.add('escaped');
    }, 150);
  });

  window.addEventListener('beforeunload', function (e) {
    if (!started) return;
    e.preventDefault();
    e.returnValue = '';
  });

  v.addEventListener('ended', function () { v.currentTime = 0; v.play(); });
})();
</script>
</body>
</html>
