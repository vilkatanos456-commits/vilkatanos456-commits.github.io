<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Страница не найдена — Давид</title>
<style>
:root{--bg:#0e1116;--surface:#171c24;--line:#262d38;--text:#eef1f5;--muted:#8b95a5;--accent:#4cc2ff;--accent-2:#7b8cff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(700px 460px at 12% 6%,rgba(76,194,255,.12),transparent 70%),var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.55;padding:24px}
.box{max-width:520px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:40px 32px}
.code{font-size:4rem;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0 0 8px}
h1{font-size:1.4rem;margin:0 0 8px}
p{color:var(--muted);margin:0 0 24px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);transition:.2s}
a:hover{border-color:var(--accent);transform:translateY(-2px)}
a.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0e1116;border:none}
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>Страница не найдена</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка.</p>
    <div class="actions">
      <a class="primary" href="/">На главную</a>
      <a href="https://t.me/penotesto" target="_blank" rel="noopener">Написать в Telegram ↗</a>
    </div>
  </div>
</body>
</html>
