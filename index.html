<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Давид — Telegram-боты и веб-сайты</title>
<style>
    :root {
        --bg: #0e1116;
        --surface: #171c24;
        --line: #262d38;
        --text: #eef1f5;
        --muted: #8b95a5;
        --accent: #4cc2ff;
        --accent-2: #7b8cff;
    }

    * { box-sizing: border-box; }

    body {
        min-height: 100vh;
        margin: 0;
        background:
            radial-gradient(600px 400px at 15% 10%, rgba(76,194,255,.12), transparent 70%),
            radial-gradient(500px 400px at 90% 90%, rgba(123,140,255,.10), transparent 70%),
            var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        display: grid;
        place-items: center;
        padding: 32px 20px;
    }

    main {
        width: 100%;
        max-width: 640px;
        animation: rise .7s ease both;
    }

    .avatar {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 2rem;
        font-weight: 700;
        color: #0e1116;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        margin-bottom: 24px;
    }

    h1 {
        font-size: clamp(2.4rem, 8vw, 3.6rem);
        line-height: 1.05;
        margin: 0 0 12px;
        letter-spacing: -0.02em;
    }

    .lead {
        color: var(--muted);
        font-size: 1.15rem;
        line-height: 1.5;
        margin: 0 0 24px;
    }

    .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 36px;
        padding: 0;
        list-style: none;
    }

    .tags li {
        padding: 6px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: .9rem;
        color: var(--muted);
        background: rgba(255,255,255,.02);
    }

    /* Дерево проектов */
    .tree {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .tree-root {
        padding: 8px 16px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--text);
        font-size: .9rem;
        font-weight: 600;
        letter-spacing: .01em;
    }

    .tree-stem {
        width: 2px;
        height: 22px;
        background: linear-gradient(to bottom, var(--accent), var(--line));
    }

    .tree-branches {
        position: relative;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        width: 100%;
        padding-top: 22px;
    }

    .tree-branches::before {
        content: "";
        position: absolute;
        top: 0;
        left: 25%;
        right: 25%;
        height: 2px;
        background: var(--line);
    }

    .tree-node {
        position: relative;
        display: flex;
    }

    .tree-node::before {
        content: "";
        position: absolute;
        top: -22px;
        left: 50%;
        transform: translateX(-50%);
        width: 2px;
        height: 22px;
        background: var(--line);
    }

    .project {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 18px 20px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        color: var(--text);
        text-decoration: none;
        transition: border-color .25s, transform .25s, box-shadow .25s;
    }

    .project:hover,
    .project:focus-visible {
        border-color: var(--accent);
        transform: translateY(-3px);
        box-shadow: 0 12px 32px rgba(76,194,255,.12);
        outline: none;
    }

    .project strong {
        display: block;
        font-size: 1.1rem;
        margin-bottom: 4px;
    }

    .project span {
        color: var(--muted);
        font-size: .9rem;
        line-height: 1.35;
    }

    .arrow {
        flex: none;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(76,194,255,.12);
        color: var(--accent);
        font-size: 1.15rem;
        transition: transform .25s;
    }

    .project:hover .arrow { transform: translate(3px, -3px); }

    @keyframes rise {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: none; }
    }

    @media (max-width: 560px) {
        .tree-branches {
            grid-template-columns: 1fr;
            gap: 12px;
            padding-top: 0;
        }
        .tree-branches::before,
        .tree-node::before {
            display: none;
        }
        .tree-stem {
            height: 16px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        main { animation: none; }
        .project, .arrow { transition: none; }
    }
</style>
</head>
<body>
<main>
    <div class="avatar" aria-hidden="true">Д</div>

    <h1>Давид</h1>
    <p class="lead">Создаю Telegram-ботов и веб-сайты.</p>

    <ul class="tags">
        <li>Telegram-боты</li>
        <li>Веб-сайты</li>
        <li>Python</li>
        <li>HTML / CSS</li>
    </ul>

    <div class="tree" aria-label="Дерево проектов">
        <div class="tree-root">Проекты</div>
        <div class="tree-stem" aria-hidden="true"></div>

        <div class="tree-branches">
            <div class="tree-node">
                <a class="project" href="https://github.com/vilkatanos456-commits/School_bot" target="_blank" rel="noopener">
                    <div>
                        <strong>School_bot</strong>
                        <span>Школьный Telegram-бот · GitHub</span>
                    </div>
                    <div class="arrow" aria-hidden="true">↗</div>
                </a>
            </div>

            <div class="tree-node">
                <a class="project" href="https://github.com/vilkatanos456-commits/beee" target="_blank" rel="noopener">
                    <div>
                        <strong>beee</strong>
                        <span>роблокс ники · GitHub</span>
                    </div>
                    <div class="arrow" aria-hidden="true">↗</div>
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
